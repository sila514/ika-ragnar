mission_navigator:
  ros__parameters:
    min_score: 0.3
    engage_lost_timeout: 2.0

    # ONEMLI: parkur_arac.sdf'teki robot spawn poz'u (0, -12, yaw 90 derece)
    # maps/parkur_map.pgm icindeki haritalanmis serbest koridorun UZERINDE
    # DEGIL - koridorun en yakin noktasindan (~ -9, -12) yaklasik 9m yanda,
    # haritanin "bilinmeyen" (205) bolgesinde kaliyor. Yani bu harita ile
    # su anki dunya dosyasi (world) TAM hizali degil (harita farkli bir
    # spawn/konumdan cikarilmis olabilir). AMCL bu bosluk boyunca sadece
    # odometriye guvenir, gercek scan-matching ancak asagidaki ilk
    # waypoint'e (harita koridoruna) ulasildiginda baslar.
    # -> Nav2'yi bu haritayla calistirmadan once RViz'de robotun gercek
    #    konumunu haritayla karsilastirip dogrulayin; mumkunse haritayi
    #    guncel world/spawn ile SLAM'i yeniden calistirarak tazeleyin.
    start_x: 0.0
    start_y: -12.0
    start_yaw_deg: 90.0

    # Haritadan (maps/parkur_map.pgm) geodesic-mesafe + duvar-mesafesi
    # agirlikli merkez hatti cikarilarak elde edilen GERCEK parkur
    # waypoint'leri (yaklasik 4m araliklarla, ~57m'lik koridorun
    # jagged/baslangic ucundan (A) yuvarlak/bitis ucuna (B) dogru).
    # Duz liste [x, y, yaw_derece, x, y, yaw_derece, ...] - "map" frame'inde.
    waypoints: [-7.14, -35.87, 109.3,
                -8.44, -32.18, 99.3,
                -9.06, -28.38, 116.2,
                -11.07, -24.31, 90.3,
                -11.09, -20.29, 86.5,
                -10.84, -16.3, 67.2,
                -9.15, -12.28, 63.3,
                -7.15, -8.29, 66.0,
                -5.41, -4.38, 47.2,
                -1.59, -0.26, 66.9,
                0.1, 3.71, 69.0,
                1.64, 7.73, 74.2,
                2.76, 11.7, 65.8,
                4.55, 15.67, 95.4,
                4.2, 19.31, 95.4]
